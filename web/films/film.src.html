<title>Ironwright Use Case Films</title>
<style>
/*FONTS*/
/* Layout: film picker on top, one 16:9 stage, transport and chapters below. Same console look as the intro film. */
:root{

}

:root[data-theme="dark"]{--page:#0B0D10;--panel:#1C2127;--ink:#F6F7F9;--sub:#ABB3BF;--line:#2F343C;--accent:#4C90F0;color-scheme:dark}
html,body{background:var(--page);color:var(--ink)}
body{font:15px/1.5 var(--sans);padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{font:500 14px/1.2 var(--sans);color:var(--sub);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:150px}
.pick button small{font:400 12px var(--mono);color:var(--sub)}
.pick button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stage{width:100%;aspect-ratio:16/9;max-width:100%;border-radius:6px;overflow:hidden;background:#111418;border:1px solid var(--line)}
canvas{display:block;width:100%;height:100%}
.bar{display:flex;align-items:center;gap:12px}
.bar button{font:500 13px/1 var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 16px;cursor:pointer;min-width:84px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.bar .t{font:400 12.5px var(--mono);color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.chapters{display:flex;flex-wrap:wrap;gap:6px}
.chapters button{font:500 13px/1 var(--sans);color:var(--sub);background:none;border:1px solid transparent;border-radius:6px;padding:8px 10px;cursor:pointer}
.chapters button[aria-current="true"]{color:var(--ink);background:var(--panel);border-color:var(--line)}
</style>

  <div class="chapters" id="chapters"></div>
</div>
