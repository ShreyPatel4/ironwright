# Optional Worker: a tiny narration endpoint on Workers AI (free tier: 10k neurons/day).
# Lets a browser (the web demo) ask for narration without holding an API token.
# The Python engine does not need it: IRONWRIGHT_LLM=cloudflare calls the Workers AI REST API directly.
#   cd deploy/worker && npx wrangler deploy
name = "ironwright-narrate"
main = "src/index.js"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

# Uncomment to attach a custom domain once coconutlabs.org is on this account:
# routes = [{ pattern = "ironwright-api.coconutlabs.org", custom_domain = true }]
