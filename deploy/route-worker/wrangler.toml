# Serves the same Pages site under a path on the main domain: coconutlabs.org/ironwright/
# Deploy:  cd deploy/route-worker && npx wrangler deploy
name = "ironwright-route"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The Pages project's production hostname. Use the custom subdomain once it is live.
[vars]
ORIGIN = "https://ironwright.pages.dev"
PREFIX = "/ironwright"

# coconutlabs.org must be a zone on the same Cloudflare account.
routes = [
  { pattern = "coconutlabs.org/ironwright", zone_name = "coconutlabs.org" },
  { pattern = "coconutlabs.org/ironwright/*", zone_name = "coconutlabs.org" },
]
