# The whole hosted stack on one machine. From the repo root:
#   docker compose -f deploy/compose.yaml up --build
# The passwords below are defaults for this private network. Only the API is
# published, and only on loopback. docs/deploy-hosted.md has every setting.
name: ironwright

x-hosted-env: &hosted-env
  IRONWRIGHT_ENV: ${IRONWRIGHT_ENV:-local}
  IRONWRIGHT_DATA: /data
  IRONWRIGHT_DEV_OPEN: ${IRONWRIGHT_DEV_OPEN:-0}
  IRONWRIGHT_DB_URL: postgres://ironwright:${POSTGRES_PASSWORD:-ironwright-local}@postgres:5432/ironwright
  IRONWRIGHT_LAKE_URI: s3://ironwright-lake/hosted
  IRONWRIGHT_S3_ENDPOINT: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-ironwright}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-ironwright-local}
  AWS_REGION: us-east-1

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  image: ironwright:local
  volumes:
    - app-data:/data
  depends_on:
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  api:
    <<: *app
    environment:
      <<: *hosted-env
      # A container has to listen on every interface to be reachable at all.
      IRONWRIGHT_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/readyz', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Behind a profile until T4 ships `ironwright worker`: without that command
  # this container would only exit with an error. The profile goes at the rebase.
  worker:
    <<: *app
    profiles: ["worker"]
    command: ["ironwright", "worker"]
    environment:
      <<: *hosted-env

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ironwright
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ironwright-local}
      POSTGRES_DB: ironwright
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ironwright", "-d", "ironwright"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ironwright}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ironwright-local}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the bucket once, then exits 0. The app waits for that exit.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ironwright}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ironwright-local}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing local/ironwright-lake

volumes:
  app-data:
  pg-data:
  minio-data:
