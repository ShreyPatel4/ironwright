[project]
name = "ironwright"
version = "0.1.0"
description = "Legacy to lakehouse to ontology to agents: an end-to-end, multi-industry modernization showcase that runs for free on a laptop."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shrey Patel", email = "shrey@shreypatel.dev" }]
license = { text = "MIT" }
dependencies = [
  "pyiceberg[sql-sqlite,pyarrow]>=0.9",
  "duckdb>=1.1",
  "pandas>=2",
  "pyarrow>=16",
  "pyyaml>=6",
  "langgraph>=0.3",
  "langgraph-checkpoint-sqlite>=2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "mcp>=1.2",
]

[project.optional-dependencies]
# Runtime deps for the connector ladder (s3, adbc source kinds). moto is a
# test fixture only and stays in dev.
connectors = [
  "boto3>=1.34",
  "adbc-driver-manager>=1.0",
  "adbc-driver-sqlite>=1.0",
]
dev = [
  "pytest>=8",
  "playwright>=1.47",
  "moto[s3]>=5",
  "boto3>=1.34",
  "adbc-driver-manager>=1.0",
  "adbc-driver-sqlite>=1.0",
  # postgres-backed rungs (CDC capture, engine swap, BI mirror) prove
  # themselves against a real server; tests skip without POSTGRES_URI.
  "psycopg[binary]>=3.1",
  "adbc-driver-postgresql>=1.0",
]

[project.scripts]
ironwright = "ironwright.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ironwright*"]

[tool.setuptools.package-data]
"ironwright" = ["packs/*/*.py", "packs/*/*.yaml", "packs/*/models/*/*.sql", "scenario/examples/*.yaml"]
