name: ci
on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_URI: postgresql://postgres:iw@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # A real postgres with logical WAL so the postgres-backed rungs (adbc
      # source, CDC capture, engine swap, BI mirror) are proven in CI, not
      # skipped. Started by hand because service containers cannot pass the
      # server the -c wal_level=logical argument.
      - run: |
          docker run -d --name ci-pg -p 5432:5432 -e POSTGRES_PASSWORD=iw \
            postgres:16 -c wal_level=logical
          for i in $(seq 1 30); do
            docker exec ci-pg pg_isready -U postgres && break; sleep 1; done
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # The 90-second demo path (docs/DEMO-SCRIPT.md) is a required check: the
  # full narrative must run in one command and under a stated wall clock, or
  # a refactor has broken the user-visible path.
  demo:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash   # stated, so GitHub adds pipefail: a pipe into tee must not hide a failure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: make demo-check
      # The test job has no browser, so the wizard is proved here. A skip is a failure: a
      # walk that did not run proves nothing, and that is how the wizard drifted off its routes.
      - run: python -m playwright install --with-deps chromium
      - name: The wizard, in a browser, against the real backend
        run: |
          pytest -q -rs tests/e2e/test_wizard_real_backend.py | tee wizard.txt
          ! grep -q SKIPPED wizard.txt
      - name: Refresh in the console, in a browser, against the real backend
        run: |
          pytest -q -rs tests/e2e/test_refresh_console.py | tee refresh.txt
          ! grep -q SKIPPED refresh.txt

  # The hosted stack from the outside: build the image, boot api + postgres +
  # object store, walk it, then prove where the data landed. The same store also
  # runs the object store tests, which skip everywhere else.
  hosted-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: deploy/compose.yaml
    defaults:
      run:
        shell: bash   # stated, so GitHub adds pipefail: a pipe into tee must not hide a failure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: docker compose build
      - run: docker compose up -d
      - name: An operator builds the demo packs, which tenants only read
        run: |
          timeout 180 bash -c 'until curl -sf http://127.0.0.1:8000/readyz; do sleep 2; done'
          docker compose exec -T api ironwright run --pack all
      - run: python deploy/hosted_smoke.py --base http://127.0.0.1:8000 --wait 30 --state smoke-state.json | tee smoke.txt
      - name: The catalog is in postgres, for the demo pack and the tenant
        run: |
          read -r _ org ws < <(grep '^tenant ' smoke.txt)
          for cat in demo/retail "tenant/$org/$ws"; do
            n=$(docker compose exec -T postgres psql -U ironwright -d ironwright -Atc \
              "select count(*) from iceberg_tables where catalog_name = '$cat'")
            echo "catalog rows for $cat: $n"; test "$n" -gt 0
          done
      - name: The tables are in the bucket and not on the disk
        run: |
          read -r _ org ws < <(grep '^tenant ' smoke.txt)
          for at in demo/retail "tenants/$org/workspaces/$ws"; do
            docker compose exec -T api python -c "
          from pyarrow import fs
          from ironwright.hosted import object_store
          sel = fs.FileSelector('ironwright-lake/hosted/$at/lake', recursive=True)
          print('\n'.join(f.path for f in object_store().get_file_info(sel)))" | tee objects.txt | tail -3
            grep -q '\.parquet$' objects.txt
          done
          test -z "$(docker compose exec -T api find /data -name '*.parquet' | head -1)"
      - name: Runs as non-root
        run: |
          test "$(docker compose exec -T api id -u)" = "10001"
          test "$(docker compose exec -T worker id -u)" = "10001"
      # Cloudflare Containers lose their disk on every sleep. Do that here: remove api and
      # worker and their volume, bring them back on an empty disk, and read org a's
      # workspace, Ask answer, job log and audit chain again. Any difference fails.
      - name: Wipe the disk, restart api and worker, and org a's state comes back
        run: |
          docker compose rm -sf api worker
          docker volume rm ironwright_app-data
          docker compose up -d api worker
          test -z "$(docker compose exec -T api ls -A /data/tenants 2>/dev/null)"
          python deploy/hosted_smoke.py --base http://127.0.0.1:8000 --wait 120 --verify smoke-state.json
          read -r _ org ws < <(grep '^tenant ' smoke.txt)
          docker compose exec -T api test -f "/data/tenants/$org/workspaces/$ws/workspace.yaml"
      # The demo packs are not snapshotted. They come back from code, on a catalog that
      # still holds their tables, and a tenant reads their evals again.
      - name: The demo packs rebuild from code on the empty disk
        run: |
          docker compose exec -T api ironwright run --pack all
          python deploy/hosted_smoke.py --base http://127.0.0.1:8000 --wait 30 --verify smoke-state.json --packs retail insurance_claims
      - if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down -v
      - name: Object store tests on the same store and postgres, with no skips
        env:
          POSTGRES_URI: postgresql://postgres:iw@127.0.0.1:5433/postgres
          IRONWRIGHT_TEST_S3_ENDPOINT: http://127.0.0.1:9100
          IRONWRIGHT_TEST_S3_KEY: iwtest
          IRONWRIGHT_TEST_S3_SECRET: iwtest-secret
        run: |
          docker run -d -p 9100:7070 -e ROOT_ACCESS_KEY_ID=iwtest -e ROOT_SECRET_ACCESS_KEY=iwtest-secret \
            "$(docker compose config --images | grep '^versity/')" --port :7070 posix /tmp
          docker run -d -p 5433:5432 -e POSTGRES_PASSWORD=iw postgres:16
          for i in $(seq 1 30); do
            python -c "import socket as s; [s.create_connection(('127.0.0.1', p), 1) for p in (9100, 5433)]" && break
            sleep 1
          done
          sleep 3
          pip install -e ".[dev]"
          pytest -q -rs tests/test_hosted.py tests/test_durable.py | tee out.txt
          ! grep -q SKIPPED out.txt

  # The customer's whole journey on the compose stack, then a second org trying to reach all
  # of it. No `needs` and no `if`, on purpose: a job skipped behind a failed job reports no red.
  # tests/e2e/test_isolation_cannot_be_skipped.py holds this block to that.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: deploy/compose.yaml
    defaults:
      run:
        shell: bash   # stated, so GitHub adds pipefail: a pipe into tee must not hide a failure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: docker compose build
      - run: docker compose up -d
      - name: The journey, then isolation
        run: |
          python tests/e2e/journey.py --base http://127.0.0.1:8000 --wait 180 --budget 600 | tee journey.log
          grep -q '^ISOLATION ok' journey.log
          grep '^JOURNEY' journey.log >> "$GITHUB_STEP_SUMMARY"
      # The walk above is API calls. This one is a customer in a browser, on this same stack,
      # through the console the image built. A skip is a failure here too.
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: The wizard, in a browser, from sign-up to a cited answer
        env:
          IRONWRIGHT_WIZARD_BASE: http://127.0.0.1:8000
        run: |
          pytest -q -rs tests/e2e/test_wizard_real_backend.py | tee wizard.log
          ! grep -q SKIPPED wizard.log
      - name: The demo org seeds on this stack, twice
        env:
          IRONWRIGHT_SEED_PASSWORD: e2e-only-not-a-secret
        run: |
          for attempt in first second; do
            docker compose exec -T -e IRONWRIGHT_SEED_PASSWORD api python - < scripts/seed_demo_org.py | tee "seed-$attempt.log"
          done
          grep -q '"created": true' seed-first.log
          grep -q '"created": false' seed-second.log
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p e2e-artifacts
          cp journey.log wizard.log seed-*.log e2e-artifacts/ || true
          docker compose ps -a > e2e-artifacts/ps.txt
          for service in api worker postgres objectstore bucket-init; do
            docker compose logs --no-color "$service" > "e2e-artifacts/$service.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-artifacts, path: e2e-artifacts }
      - if: always()
        run: docker compose down -v

  site:
    needs: test
    runs-on: ubuntu-latest
    env:
      IRONWRIGHT_DATA: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" playwright
      - run: ironwright run --pack all                 # also exports web/data/*.json
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/film_specs.py && python scripts/build_films.py && python scripts/build_intro.py
      - run: python scripts/build_site.py              # uses the MP4s committed in media/
      - uses: actions/upload-artifact@v4
        with: { name: site, path: site }
      # Deploys only when Cloudflare secrets exist. main -> production, staging -> staging preview, PRs -> preview.
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name ironwright --branch ${{ github.head_ref || github.ref_name }}

  route-worker:
    needs: site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the coconutlabs.org/ironwright route
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/route-worker
          command: deploy
